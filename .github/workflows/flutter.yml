name: Phase 0 Flutter

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

defaults:
  run:
    working-directory: app

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: dart tool/check_sdk.dart
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  windows:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: dart tool/check_sdk.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub
      - run: flutter build windows --release --no-pub

  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sha256sum --check android/gradle/wrapper/gradle-wrapper.jar.sha256
      - run: chmod +x android/gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: dart tool/check_sdk.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub

  ios:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: dart tool/check_sdk.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --no-pub
